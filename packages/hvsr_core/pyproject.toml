[project]
name = "hvsr-core"
version = "0.1.0"
description = "Standalone HVSR scientific core: preprocessing, spectra, peak families, template-assisted window selection, dependence-aware uncertainty, SESAME diagnostics."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
authors = [{ name = "HVSR Analyzer contributors" }]
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "obspy>=1.4.1,<2",
    "lxml>=5.0,<7",
    "pydantic>=2.9,<3",
    "jsonschema>=4.23,<5",
    "matplotlib>=3.9,<4",
    "arch>=7.0,<9",
]

[project.scripts]
hvsr = "hvsr_core.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hvsr_core"]
